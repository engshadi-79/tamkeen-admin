<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>وكيل تمكين</title>
<style>
  body { width: 340px; margin: 0; padding: 16px; font: 14px/1.7 system-ui, "Segoe UI", sans-serif; color: #14284B; background: #fff; }
  h1 { font-size: 16px; margin: 0 0 6px; }
  p { margin: 6px 0; color: #4b5668; font-size: 13px; }
  input[type=file] { width: 100%; margin: 8px 0; }
  #info { background: #f3f5f9; border-radius: 8px; padding: 8px 10px; font-size: 13px; min-height: 20px; }
  button { margin-top: 10px; width: 100%; padding: 9px; border: 0; border-radius: 8px; background: #1d8f85; color: #fff; font: inherit; cursor: pointer; }
  button:disabled { background: #b8c2cf; cursor: default; }
  #msg { margin-top: 8px; font-size: 13px; }
  .err { color: #c0392b; }
  .ok { color: #1d8f85; }
</style>
</head>
<body>
  <h1>وكيل تمكين</h1>
  <p>اختر <b>ملف الأوامر</b> الذي أنشأه تمكين (<span dir="ltr">ksach-commands.json</span>). تظهر لك <b>معاينة</b> في نظام المركز، ولا يُكتب شيء حتى تضغط «نفّذ» هناك.</p>
  <input type="file" id="f" accept=".json">
  <div id="info">لم يُختر ملف.</div>
  <button id="go" disabled>ابدأ في نظام المركز</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
